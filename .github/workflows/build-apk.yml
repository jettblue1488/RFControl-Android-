
name: Build RF Control APK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test, lint and build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RFControl-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RFControl-Android-APK
          path: app/build/outputs/apk/debug/*.apk
