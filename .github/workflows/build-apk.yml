name: Build RF Control APK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    # Publishing the APK to GitHub Releases requires contents: write.
    # Pull requests run the checks but never publish a release.
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test, lint and build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RFControl-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Upload APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: RFControl-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Give APK a consistent download filename
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk_files=(app/build/outputs/apk/debug/*.apk)
          test -f "${apk_files[0]}"
          cp "${apk_files[0]}" RFControl-Android.apk

      - name: Publish direct-download GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-apk >/dev/null 2>&1; then
            gh release upload android-apk RFControl-Android.apk --clobber
          else
            gh release create android-apk RFControl-Android.apk \
              --title "RF Control — Android APK" \
              --notes "Download RFControl-Android.apk and tap it on an Android 8+ phone to install RF Control. This is a debug-signed build from the main branch. A differently signed prior install may need uninstalling first, which deletes its locally saved history." \
              --latest
          fi

      # The GitHub Releases asset redirects to release-assets.githubusercontent.com.
      # Mirror the APK in a dedicated branch so users whose network blocks that
      # host can download from raw.githubusercontent.com instead.
      - name: Publish non-expiring raw APK mirror
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp RFControl-Android.apk "$RUNNER_TEMP/RFControl-Android.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin apk-download
          git switch -C apk-download origin/apk-download
          cp "$RUNNER_TEMP/RFControl-Android.apk" RFControl-Android.apk
          git add RFControl-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest Android APK from ${GITHUB_SHA}"
            git push origin HEAD:apk-download
          fi
